# Figure lifecycle tests with real custom-code children.
#
# Runs the figure store/save/listing/template tests and the custom-code submit_figure tests,
# whose children are real subprocesses. No other workflow runs these files. On Linux the
# execution service starts the child as a plain subprocess.
#
# Read-only token, no secrets, no cloud credentials, no network calls by the tests.

name: Figure lifecycle

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  figure-lifecycle:
    name: Figure lifecycle (real children)
    runs-on: ubuntu-latest
    timeout-minutes: 30  # hang watch for the whole job; each test also has a pytest-timeout cap below

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          df -h

      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6

      - name: Install from the frozen lock
        id: install
        run: |
          uv sync --frozen --python 3.12 \
            --extra dev --extra bedrock --extra transcriptomics --extra proteomics

      - name: Run figure lifecycle tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          LOBSTER_ROUTING_TELEMETRY: "0"
          DO_NOT_TRACK: "1"
          LANGCHAIN_TRACING_V2: "false"
          LANGSMITH_TRACING: "false"
          HF_HUB_OFFLINE: "1"
        run: |
          # Known deselects, each with its reason:
          # - 16 test_k2_* tests in test_d7_local_store.py: they cover a store-binding mode that
          #   is not enabled yet.
          # The chem cases of test_templates.py::test_invalid_similarity_is_not_sampled_or_guessed
          # skip when the optional chem template provider is not installed.
          DESELECT=()
          for t in \
            test_k2_first_opted_bind_refuses_a_foreign_lock_before_acquiring_it \
            test_k2_a_different_store_after_first_use_is_refused_before_any_root \
            test_k2_an_opted_pm_refuses_reconfiguration_after_first_use \
            test_k2_a_reconfiguration_racing_the_first_bind_refuses_that_bind \
            test_k2_a_hide_before_publication_publishes_into_neither_container \
            test_k2_a_forget_waits_for_the_publication_hold_then_removes_both \
            test_k2_forget_after_publication_removes_both_containers \
            test_k2_a_second_opted_pm_on_the_same_root_never_publishes_a_hidden_ref \
            test_k2_forget_reaches_an_evicted_queue_entry \
            test_k2_forget_returns_only_the_unique_refs_it_removed \
            test_k2_an_opted_pm_with_no_prior_use_binds_in_forget_without_a_figure \
            test_k2_a_non_opted_pm_keeps_todays_publication_queue_and_clear \
            test_k2_a_bound_forget_inside_an_outer_root_hold_needs_no_provider_or_attempt_lock \
            test_k2_an_opted_prepare_failure_appends_nothing_and_keeps_the_outcome \
            test_k2_off_to_off_configuration_keeps_its_original_lock_behaviour \
            test_k2_no_root_publication_or_provider_work_under_the_attempt_lock
          do
            DESELECT+=("tests/unit/core/figures/test_d7_local_store.py::$t")
          done
          ARGS=()
          for d in "${DESELECT[@]}"; do ARGS+=(--deselect "$d"); done
          test "${#ARGS[@]}" -eq 32
          .venv/bin/python -m pytest \
            tests/unit/tools/test_custom_code_figures.py \
            tests/unit/core/figures \
            tests/unit/core/test_plot_manager.py \
            tests/unit/core/test_plot_save_reporting.py \
            tests/unit/test_figure_contract_d8.py \
            tests/unit/figure_templates/test_templates.py \
            "${ARGS[@]}" \
            -n 4 \
            --timeout=300 \
            --no-cov \
            -p no:cacheprovider \
            --junit-xml=results-figure-lifecycle.xml \
            --tb=short
          .venv/bin/python scripts/check_test_results.py results-figure-lifecycle.xml

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results-figure-lifecycle
          path: results-figure-lifecycle.xml
          retention-days: 7
